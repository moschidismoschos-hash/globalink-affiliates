<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020817">
  <meta name="description" content="GlobalLink — αγορά, ταξίδια, βιβλία και παιχνίδια.">
  <title>GlobalLink</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: #020817; }
    body {
      margin: 0;
      min-width: 320px;
      background: #020817;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }
    .site {
      position: relative;
      width: 100%;
      max-width: 1024px;
      margin: 0 auto;
      background: #020817;
      line-height: 0;
    }
    .site-image {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }
    .hotspot {
      position: absolute;
      display: block;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .hotspot:focus-visible {
      outline: 3px solid #30a8ff;
      outline-offset: 2px;
      border-radius: 14px;
    }
    .partners { left: 79.5%; top: 1.4%; width: 13%; height: 3.2%; }
    .shopping { left: 2%; top: 60.4%; width: 22.7%; height: 32.5%; }
    .travel { left: 25.3%; top: 60.4%; width: 22.8%; height: 32.5%; }
    .books { left: 49%; top: 60.4%; width: 22.8%; height: 32.5%; }
    .games { left: 73%; top: 60.4%; width: 24.6%; height: 32.5%; }

    dialog {
      width: min(90vw, 420px);
      border: 1px solid #1678ff;
      border-radius: 18px;
      padding: 22px;
      color: #fff;
      background: #06162f;
      box-shadow: 0 20px 60px rgba(0,0,0,.65);
      line-height: 1.45;
      text-align: center;
    }
    dialog::backdrop { background: rgba(0, 4, 15, .78); }
    dialog h2 { margin: 0 0 10px; font-size: 1.35rem; }
    dialog p { margin: 0 0 18px; color: #d5e8ff; }
    dialog button {
      min-width: 130px;
      border: 1px solid #2691ff;
      border-radius: 12px;
      padding: 11px 18px;
      color: #fff;
      background: #0754d8;
      font-size: 1rem;
    }
    @media (min-width: 1025px) {
      body { background: radial-gradient(circle at top, #082963, #020817 55%); }
      .site { box-shadow: 0 0 70px rgba(0, 119, 255, .22); }
    }
  </style>
</head>
<body>
  <main class="site" id="partners">
    <img class="site-image" src="globalink-home.png" alt="Η αρχική σελίδα GlobalLink με τις ενότητες Αγορά, Ταξίδια, Βιβλία και Παιχνίδια">

    <a class="hotspot partners" href="#partners" aria-label="Οι συνεργάτες μας"></a>
    <button class="hotspot shopping" type="button" aria-label="Αγορά" data-title="Αγορά" data-text="Εδώ θα προστεθούν οι συνεργάτες και οι προσφορές αγορών."></button>
    <button class="hotspot travel" type="button" aria-label="Ταξίδια" data-title="Ταξίδια" data-text="Εδώ θα προστεθούν οι ταξιδιωτικοί συνεργάτες και οι προσφορές."></button>
    <button class="hotspot books" type="button" aria-label="Βιβλία" data-title="Βιβλία" data-text="Εδώ θα ανεβάζεις τα δικά σου βιβλία για ανάγνωση ή λήψη."></button>
    <button class="hotspot games" type="button" aria-label="Παιχνίδια" data-title="Παιχνίδια" data-text="Εδώ θα ανεβάζεις τα δικά σου παιχνίδια για χρήση ή λήψη."></button>
  </main>

  <dialog id="messageDialog">
    <h2 id="dialogTitle"></h2>
    <p id="dialogText"></p>
    <button id="closeDialog" type="button">Κλείσιμο</button>
  </dialog>

  <script>
    const dialog = document.getElementById('messageDialog');
    const title = document.getElementById('dialogTitle');
    const text = document.getElementById('dialogText');

    document.querySelectorAll('[data-title]').forEach((button) => {
      button.addEventListener('click', () => {
        title.textContent = button.dataset.title;
        text.textContent = button.dataset.text;
        dialog.showModal();
      });
    });

    document.getElementById('closeDialog').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', (event) => {
      if (event.target === dialog) dialog.close();
    });
  </script>
</body>
</html>
