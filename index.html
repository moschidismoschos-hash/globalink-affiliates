<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020816">
  <title>GlobalLink</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #020816;
    }

    body {
      overflow-x: hidden;
    }

    main {
      width: 100%;
      max-width: 1024px;
      margin: 0 auto;
      line-height: 0;
      background: #020816;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <main>
    <img src="globalink-home.png" alt="GlobalLink">
  </main>
</body>
</html>
